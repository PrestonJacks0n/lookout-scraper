# Lookout scraper: which job boards to read (Lookout reads the feed this produces).
#
# To add a company (works from the GitHub app or website, no terminal needed):
#   1. Open this file on GitHub and tap the pencil (Edit).
#   2. Copy one block below and change the name and url. If you don't know the board type, use "browser".
#   3. Commit. The next scheduled run picks it up.
#
# Board types (fastest and most reliable first):
#   greenhouse  - board: the slug in job-boards.greenhouse.io/<slug>
#   lever       - board: the slug in jobs.lever.co/<slug>
#   ashby       - board: the slug in jobs.ashbyhq.com/<slug>
#   smartrecruiters - board: the company id in jobs.smartrecruiters.com/<id>
#   workday     - url: https://<tenant>.wdN.myworkdayjobs.com/<site>
#   eightfold   - url: the careers site; domain: the company's domain
#   browser     - url: any careers or search page; opened in a real Chrome
# Any API type can also have a "url" — if the API fails, that page is opened in the browser instead.

companies:
