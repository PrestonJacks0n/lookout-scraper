name: Lookout scrape

on:
  schedule:
    # Every 3 hours. GitHub has been starting scheduled runs 5 to 8 hours late, so timing runs
    # just before each Lookout report doesn't work; a steady cadence keeps the feed a few hours
    # old at most. ~8 runs/day x ~3 min is roughly 750 of the 2,000 free private-repo minutes a month.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated company names to run (blank = all)"
        required: false
  push:
    branches: [main]
    paths: ["companies.yaml", "scrape.py", "requirements.txt", ".github/workflows/scrape.yml"]

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          ONLY: ${{ github.event.inputs.only }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scrape.py

      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "lookout-bot"
          git config user.email "lookout-bot@users.noreply.github.com"
          git add out/ gist_id.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Scrape results $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          # Another run may have pushed results while this one was scraping. Keep this run's
          # out/ files on a conflict (-X theirs = the commit being replayed), then retry the push.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
